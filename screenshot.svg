<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0073aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a0d2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-gradient)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#ffffff"/>
  <text x="60" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#1e1e1e">Monomyth FSE</text>
  
  <!-- Navigation placeholder -->
  <text x="900" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#757575">Home   About   Blog   Contact</text>
  
  <!-- Main Content Area -->
  <rect x="100" y="160" width="1000" height="500" fill="#ffffff" rx="8"/>
  
  <!-- Hero Section -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#1e1e1e" text-anchor="middle">Welcome to Monomyth FSE</text>
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#757575" text-anchor="middle">A minimal FSE theme for WordPress</text>
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#757575" text-anchor="middle">Built for the Awesome No Code Platform</text>
  
  <!-- Button placeholder -->
  <rect x="520" y="460" width="160" height="50" fill="#0073aa" rx="4"/>
  <text x="600" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Get Started</text>
  
  <!-- Footer -->
  <rect x="0" y="800" width="1200" height="100" fill="#f0f0f0"/>
  <text x="600" y="860" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#757575" text-anchor="middle">© 2025 WPoets. Built with Monomyth FSE.</text>
</svg>
